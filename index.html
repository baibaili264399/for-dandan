<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fffaf3" />
<title>你想知道的一切</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23ee5f5f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ 全局装饰光斑 ============ -->
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>
<div class="glow glow-c" aria-hidden="true"></div>

<!-- ============ 顶部工具条 ============ -->
<header class="topbar" id="topbar" hidden>
  <button class="icon-btn" id="reloadBtn" type="button" title="改完 content.js 后点我，不用刷新页面">↻ 重载文案</button>
  <div class="topbar-right">
    <button class="icon-btn" id="shuffleBtn" type="button" title="随便翻开一张">🎲 随机</button>
    <button class="icon-btn" id="musicBtn" type="button" aria-pressed="false" title="背景音乐">♪ 音乐</button>
  </div>
</header>

<!-- ============ 第 1 屏：封面 ============ -->
<section class="cover" id="cover">
  <div class="cover-inner">
    <p class="cover-to" id="coverTo">给 丹丹</p>
    <h1 class="cover-title" id="coverTitle">你想知道的一切</h1>
    <p class="cover-sub" id="coverSub">九个问题，九个答案</p>

    <button class="envelope" id="openBtn" type="button" aria-label="打开">
      <span class="envelope-body"></span>
      <span class="envelope-flap"></span>
      <span class="envelope-heart">♥</span>
    </button>
    <p class="cover-hint" id="coverHint">点一下打开</p>
  </div>
</section>

<!-- ============ 第 2 屏：九宫格 ============ -->
<main class="board" id="board" hidden>
  <div class="board-head">
    <h2 class="board-title" id="boardTitle">你想知道的一切</h2>
    <p class="board-sub" id="boardSub">点开任意一格</p>
  </div>
  <div class="grid" id="grid"></div>
  <p class="board-progress">
    <span id="progressText">已经点开 0 / 9</span>
  </p>

  <!-- 看完之后的入口 -->
  <div class="finale-cta-wrap">
    <button class="finale-cta" id="finaleCta" type="button">
      <span class="cta-spark">✦</span>
      <span id="ctaText">看完点击它</span>
      <span class="cta-spark">✦</span>
    </button>
    <p class="finale-cta-sub" id="ctaSub">都看完了就点它</p>
  </div>
</main>

<!-- ============ 弹层：单张内容 ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>

    <div class="modal-scroll" id="modalScroll">
      <figure class="modal-figure">
        <img id="mImage" src="" alt="" />
        <figcaption class="modal-caption" id="mCaption"></figcaption>
      </figure>

      <div class="modal-body">
        <div class="modal-kicker">
          <span class="mini-spot" id="mNum">1</span>
          <span class="kicker-text" id="mKicker">第 <b id="mNum2">1</b> 个答案</span>
        </div>
        <h3 class="modal-title" id="mTitle">标题</h3>
        <div class="modal-text" id="mText"></div>
      </div>
    </div>

    <footer class="modal-foot">
      <button class="ghost-btn" id="backBtn" type="button" hidden>← 返回选项</button>
      <span class="foot-spring"></span>
      <button class="ghost-btn" id="prevBtn" type="button">← 上一个</button>
      <span class="modal-index" id="mIndex">1 / 9</span>
      <button class="ghost-btn" id="nextBtn" type="button">下一个 →</button>
    </footer>
  </article>
</div>

<!-- ============ 爱心彩蛋 ============ -->
<button class="heart-btn" id="heartBtn" type="button" title="点我">
  <span class="heart-icon">♥</span>
  <span class="heart-count" id="heartCount">0</span>
</button>

<!-- ============ 轻提示 ============ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ 背景音乐（把 music/music.mp3 放进去就生效） ============ -->
<audio id="bgm" loop preload="none">
  <source src="music/music.mp3" type="audio/mpeg" />
</audio>

<!-- ============ 收尾页：小树 + 姻缘牌 + 孔明灯 ============ -->
<section class="finale" id="finale" hidden>
  <div class="finale-moon" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="finale-glow" aria-hidden="true"></div>

  <button class="finale-close" id="finaleClose" type="button" aria-label="返回">×</button>

  <div class="finale-stage">
    <svg class="tree" id="tree" viewBox="0 0 800 900" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <radialGradient id="leafGrad" cx="34%" cy="28%" r="72%">
          <stop offset="0" stop-color="#a8e884"/>
          <stop offset="1" stop-color="#4c9a3c"/>
        </radialGradient>
        <radialGradient id="leafGrad2" cx="34%" cy="28%" r="72%">
          <stop offset="0" stop-color="#8ed46a"/>
          <stop offset="1" stop-color="#357a2c"/>
        </radialGradient>
        <linearGradient id="plaqueGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#eccb96"/>
          <stop offset=".5" stop-color="#d3a464"/>
          <stop offset="1" stop-color="#b8834a"/>
        </linearGradient>
      </defs>

      <g class="tree-parts">
        <path class="trunk"    d="M400 884 C396 790 390 706 388 622 C386 560 386 494 392 428"/>
        <path class="trunk-hl" d="M406 880 C402 786 396 704 394 620 C392 558 392 494 398 430"/>
        <path class="branch" style="--d:.85s" d="M389 604 C432 572 480 522 522 470"/>
        <path class="branch" style="--d:1.05s" d="M388 662 C350 630 300 590 254 544"/>
        <path class="branch" style="--d:1.25s" d="M390 532 C426 492 456 432 480 380"/>
        <path class="branch" style="--d:1.45s" d="M389 562 C356 520 326 470 300 420"/>
        <path class="branch" style="--d:1.65s" d="M392 470 C394 430 395 382 396 332"/>
      </g>

      <g class="leaves" id="leaves"></g>

      <!-- 挂着的姻缘牌 -->
      <g class="plaque" id="plaque" role="button" tabindex="0" aria-label="点击它">
        <line class="plaque-string" x1="522" y1="470" x2="522" y2="520"/>
        <g class="plaque-swing">
          <circle class="plaque-ring" cx="522" cy="527" r="6.5"/>
          <rect class="plaque-body"  x="482" y="534" width="80" height="152" rx="11"/>
          <rect class="plaque-inner" x="491" y="543" width="62" height="134" rx="8"/>
          <text class="plaque-text" x="522" y="582">点</text>
          <text class="plaque-text" x="522" y="624">击</text>
          <text class="plaque-text" x="522" y="666">它</text>
          <circle class="plaque-star" cx="470" cy="546" r="3" style="animation-delay:.2s"/>
          <circle class="plaque-star" cx="576" cy="600" r="2.6" style="animation-delay:1.1s"/>
          <circle class="plaque-star" cx="468" cy="648" r="2.4" style="animation-delay:1.9s"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="lantern-layer" id="lanternLayer" aria-hidden="true"></div>

  <p class="finale-hint" id="finaleHint">小树在长……</p>

  <div class="finale-foot" id="finaleFoot" hidden>
    <button class="ghost-btn" id="finaleReplay" type="button">再看一次</button>
    <button class="ghost-btn" id="finaleBack" type="button">回去看看</button>
  </div>
</section>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
